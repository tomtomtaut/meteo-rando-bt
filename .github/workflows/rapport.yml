name: Rapport météo rando

on:
  schedule:
    # 21h40 UTC = 17h40 en Guadeloupe : rapport du soir (demain, après-demain, J+3), en ligne vers 18h
    - cron: "40 21 * * *"
    # 9h20 UTC = 5h20 en Guadeloupe : mise à jour du matin (aujourd'hui, demain, après-demain)
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rapport
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py --out site --history history
      # Archive des scores (sert à calibrer, et garde le dépôt actif :
      # GitHub coupe les tâches planifiées d'un dépôt public après 60 jours sans activité)
      - name: Archiver les scores
        run: |
          git config user.name "rapport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git commit -m "Scores du $(date -u +%F)" || echo "rien à archiver"
          git push || echo "push impossible"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
